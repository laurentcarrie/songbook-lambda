name: Publish band-songbook

on:
  push:
    branches:
      - main
    paths:
      - 'band-songbook/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # The image of docker/build (build-image.yml): rust, texlive, lilypond, ffmpeg, fluidsynth, the fonts. Not an apt
    # install on the runner: on the ubuntu-26.04 runner apt cannot resolve the Ubuntu mirrors, the install crawled for
    # 45 minutes and failed.
    container:
      image: ghcr.io/laurentcarrie/songbook-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            band-songbook/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        working-directory: band-songbook
        run: cargo test --lib -- --skip test_yamake_build_song --skip test_make_all --skip test_yamake_build_pdf

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            band-songbook/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Get crate version
        id: crate_version
        working-directory: band-songbook
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: check_published
        run: |
          if cargo search --color never band-songbook --limit 1 | grep -q "^band-songbook = \"${{ steps.crate_version.outputs.version }}\""; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.crate_version.outputs.version }} is already published on crates.io"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.crate_version.outputs.version }} is not yet published"
          fi

      - name: Verify package
        if: steps.check_published.outputs.already_published == 'false'
        working-directory: band-songbook
        run: cargo package --list

      - name: Publish to crates.io (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        working-directory: band-songbook
        run: cargo publish --dry-run

      - name: Publish to crates.io
        if: |
          steps.check_published.outputs.already_published == 'false' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'))
        working-directory: band-songbook
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
